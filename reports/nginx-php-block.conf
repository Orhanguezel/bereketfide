# Bereketfide — tarama/probe savunmasi
# ============================================================
# NEDEN
# Site tamamen Next.js; hicbir .php kaynagi yok. Buna ragmen kok
# seviyedeki /1996.php gibi cop yollar Next.js'in [locale] dinamik
# route'una dusuyor ve site bunu "locale = 1996.php" sanip tam SSR
# render'i yapiyor.
#
# 7-20 Temmuz 2026 loglarindan olculen sonuc:
#   - tek cop istek -> ~46 backend API cagrisi
#   - yanit: 200 OK + 182 KB  (arama motoru icin soft-404)
#   - donem icinde 180 adet .php istegi 200 aldi
#   - ayrica ~7.000 wp-admin / wp-login istegi (bunlar zaten 404 donuyor)
#
# Bu blok istekleri kenarda keser: ne frontend'e ne backend'e ulasir.
#
# NASIL UYGULANIR
#   sudo cp /etc/nginx/sites-enabled/bereketfide \
#           /etc/nginx/sites-enabled/bereketfide.bak-$(date +%Y%m%d-%H%M)
#   # asagidaki iki location blogunu ana HTTPS server { } blogunun icine,
#   # "# Next.js frontend API routes" satirindan hemen once yapistir
#   sudo nginx -t && sudo systemctl reload nginx
#
# DOGRULAMA (uygulama sonrasi 404 beklenir)
#   curl -s -o /dev/null -w '%{http_code}\n' https://www.bereketfide.com.tr/1996.php
#   curl -s -o /dev/null -w '%{http_code}\n' https://www.bereketfide.com.tr/wp-login.php
#
# GERI ALMA
#   sudo cp /etc/nginx/sites-enabled/bereketfide.bak-<tarih> \
#           /etc/nginx/sites-enabled/bereketfide
#   sudo nginx -t && sudo systemctl reload nginx
#
# UYARI — 187.124.166.65 ENGELLENMEMELIDIR
# Loglardaki en yogun kaynak (62.391 istek, user-agent "node") sunucunun
# KENDI public IP'sidir; Next.js SSR katmaninin kendi API'sine yaptigi
# cagrilardir. deny eklenirse site tamamen calismaz.
# ============================================================

# Hicbir .php kaynagi yok — kenarda 404
location ~* \.php$ {
    access_log off;
    return 404;
}

# WordPress tarayicilarinin sik denedigi yollar
location ~* ^/(wp-admin|wp-includes|wp-content|wordpress) {
    access_log off;
    return 404;
}
